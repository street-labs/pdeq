name: CI

on:
  pull_request:
  push:
    branches: [main]

# pdeq's own audits and test suites. Everything here runs with only bash +
# python3 + git — no extra toolchain — matching pdeq's install-dependency floor.
jobs:
  audits:
    name: Traceability + lane audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the coverage grace-period reads git log
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Traceability audit (strict)
        run: ./scripts/audit-traceability.sh --check
      - name: Lane-discipline lexical backstop
        run: ./scripts/audit-lanes.sh

  tests:
    name: Test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # migration/grace tests inspect git history
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Migrations suite
        run: ./engineering/apps/cli/tests/migrations/run-all.sh
      - name: Code-mapping suite
        run: ./engineering/apps/cli/tests/code-mapping/run-all.sh
      - name: Lane-discipline regression
        run: ./engineering/apps/cli/tests/lane-discipline/regression-coffee-auth.sh
