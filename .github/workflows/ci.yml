name: CI

on:
  pull_request:
  push:
    branches: [main]

# pdeq's own audits and test suites. Everything here runs with only bash +
# python3 + git — no extra toolchain — matching pdeq's install-dependency floor.
jobs:
  audits:
    name: Traceability + lane audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the coverage grace-period reads git log
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Traceability audit (strict)
        run: ./scripts/audit-traceability.sh --check
      - name: Lane-discipline lexical backstop
        run: ./scripts/audit-lanes.sh
      - name: Lane-discipline blocking structural check
        run: ./scripts/audit-structure.sh
      - name: QA coverage audit (CI)
        # Implements: FR-coverage-audit-independent
        # PDEQ_ALLOW_DRIFT=1: pdeq's own coverage matrices need updating.
        # Remove this override once all features with code have terminal coverage.
        run: PDEQ_ALLOW_DRIFT=1 ./scripts/audit-coverage.sh --check

  tests:
    name: Test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # migration/grace tests inspect git history
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Migrations suite
        run: ./engineering/apps/cli/tests/migrations/run-all.sh
      - name: Code-mapping suite
        run: ./engineering/apps/cli/tests/code-mapping/run-all.sh
      - name: Implement suite
        run: ./engineering/apps/cli/tests/implement/run-all.sh
      - name: Lane-discipline regression
        run: ./engineering/apps/cli/tests/lane-discipline/regression-coffee-auth.sh
      - name: Lane-discipline structural check (Layer 1b)
        run: ./engineering/apps/cli/tests/lane-discipline/test-structure.sh
